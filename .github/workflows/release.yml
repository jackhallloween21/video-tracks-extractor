name: Build & Release Windows EXE

# Runs automatically whenever you push a tag like v1.0.0, v1.2.3, etc.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone .exe with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name StreamExtractor
          --icon assets\icon.ico
          --add-data "assets\icon.ico;assets"
          stream_extractor.py

      - name: Verify the exe was produced
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist\StreamExtractor.exe")) {
            Write-Error "Build did not produce dist\StreamExtractor.exe"
            exit 1
          }
          Write-Host "Built dist\StreamExtractor.exe ($((Get-Item 'dist\StreamExtractor.exe').Length) bytes)"

      - name: Create GitHub Release and upload exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StreamExtractor.exe
          generate_release_notes: true
