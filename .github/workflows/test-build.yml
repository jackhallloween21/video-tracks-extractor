name: Build & Test EXE (manual)

# Run this manually from the Actions tab whenever you want to check that
# the app still builds into a working .exe, without cutting a release.
# Actions tab -> "Build & Test EXE (manual)" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      smoke_test_seconds:
        description: "How many seconds to let the built exe run before checking it's still alive"
        required: false
        default: "5"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone .exe with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name StreamExtractor
          --icon assets\icon.ico
          --add-data "assets\icon.ico;assets"
          stream_extractor.py

      - name: Verify the exe was produced
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist\StreamExtractor.exe")) {
            Write-Error "Build did not produce dist\StreamExtractor.exe"
            exit 1
          }
          Write-Host "Built dist\StreamExtractor.exe ($((Get-Item 'dist\StreamExtractor.exe').Length) bytes)"

      - name: Smoke test - launch the exe and confirm it doesn't crash on startup
        shell: pwsh
        run: |
          $seconds = [int]"${{ github.event.inputs.smoke_test_seconds }}"
          Write-Host "Launching StreamExtractor.exe for a $seconds second smoke test..."
          $proc = Start-Process -FilePath "dist\StreamExtractor.exe" -PassThru
          Start-Sleep -Seconds $seconds

          if ($proc.HasExited) {
            Write-Error "The exe exited on its own within $seconds seconds (exit code $($proc.ExitCode)). It likely crashed on startup."
            exit 1
          }

          Write-Host "Still running after $seconds seconds - looks healthy. Stopping it now."
          Stop-Process -Id $proc.Id -Force

      - name: Upload exe as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamExtractor-windows-exe
          path: dist/StreamExtractor.exe
          retention-days: 14
